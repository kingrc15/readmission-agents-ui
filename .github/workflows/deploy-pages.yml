name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # So Variables/Secrets attached to the "github-pages" environment are visible here.
    # If your VITE_API_BASE_URL is only under Environments → github-pages, this is required.
    # You can instead define it under repo Settings → Secrets and variables → Actions → Variables (no environment).
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
          VITE_READMIT_API_TOKEN: ${{ secrets.VITE_READMIT_API_TOKEN || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "::error::VITE_API_BASE_URL was empty at build time. Add it as a **repository** Variable (Settings → Secrets and variables → Actions → Variables) OR under **Environment** github-pages (this workflow uses environment: github-pages on the build job). Use your public FastAPI root, e.g. https://your-tunnel.ngrok-free.dev — no trailing slash."
            exit 1
          fi
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
